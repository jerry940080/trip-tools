<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅行記帳・餐廳（測試版）</title>
<meta name="theme-color" content="#f5ead8">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5ead8;--card:#fffaf2;--ink:#2a221b;--mute:#7c6f62;--acc:#c67139;--line:#e4d6c0;--ok:#3d7a4a;--bad:#b23a2a;--soft:#eadfcb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,"Noto Sans TC",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.cap{font-family:Caprasimo,"Noto Sans TC",serif;font-weight:400}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:110px}
.test{background:#2a221b;color:#ffcf9e;font-size:12px;text-align:center;padding:calc(5px + env(safe-area-inset-top)) 10px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top{padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:2px 0 0;font-size:23px}.top .t{font-size:12px;color:var(--mute)}
.ava{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;flex:none;background-size:cover;background-position:center}
.seg{display:flex;margin:4px 16px 10px;background:var(--soft);border-radius:999px;padding:4px}
.seg button{flex:1;text-align:center;padding:7px 4px;border-radius:999px;font-size:13px}.seg button.on{background:var(--card);box-shadow:0 2px 6px #0001;font-weight:800}
.sum{margin:0 16px 10px;background:var(--ink);color:#fff;border-radius:22px;padding:14px 16px}
.sum .k{font-size:11.5px;opacity:.7}.sum .v{font-size:22px;font-weight:800}
.ppl{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}.ppl::-webkit-scrollbar{display:none}
.pp{flex:none;display:flex;align-items:center;gap:7px;background:#ffffff14;border-radius:14px;padding:6px 10px 6px 6px}
.pp .n{font-size:12px;opacity:.85}.pp .b{font-size:13.5px;font-weight:800}
.pos{color:#9fe0a8}.neg{color:#ffb0a5}.posd{color:var(--ok)}.negd{color:var(--bad)}
.day{font-size:12.5px;color:var(--mute);font-weight:800;margin:14px 20px 6px;display:flex;justify-content:space-between}
.it{margin:0 16px 8px;background:var(--card);border-radius:18px;padding:11px 14px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:calc(100% - 32px);text-align:left}
.it .ic{width:34px;height:34px;border-radius:12px;background:#fde3cf;display:flex;align-items:center;justify-content:center;font-size:17px}
.it .n{font-weight:800;font-size:15px}.it .m{font-size:12px;color:var(--mute);margin-top:2px}.it .a{text-align:right;font-weight:800;white-space:nowrap}.it .a small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:4px;background:#efe7f6;color:#5e3f7a;vertical-align:2px}
.empty{margin:14px 16px;background:var(--card);border-radius:18px;padding:18px;color:var(--mute);font-size:14px;line-height:1.7;text-align:center}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:96px;background:var(--acc);color:#fff;border-radius:999px;padding:13px 18px;font-weight:800;box-shadow:0 8px 20px #c6713966;z-index:5}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:min(496px,calc(100% - 24px));bottom:calc(12px + env(safe-area-inset-bottom));background:#fffaf2;border-radius:24px;box-shadow:0 8px 24px #0002;display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:6}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px;border-radius:16px;font-size:11.5px;text-decoration:none}.tabs a.on{background:#fde3cf;color:#8c491a;font-weight:800}.tabs i{font-style:normal;font-size:18px}
.card{margin:0 16px 10px;background:var(--card);border-radius:20px;padding:14px}
.pc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.pc:last-child{border:0}
.pc .n{font-weight:800}.pc .m{font-size:12px;color:var(--mute)}.pc .bal{font-weight:800;text-align:right}
.tr{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}.tr:last-child{border:0}
.tr .arr{color:var(--mute)}.tr .v{text-align:right;font-weight:800;font-size:16px}
.sbtn{font-size:12px;border:2px solid var(--ok);color:var(--ok);border-radius:999px;padding:3px 10px;font-weight:800}
.done{font-size:11.5px;background:#dcebd9;color:var(--ok);border-radius:999px;padding:2px 8px;font-weight:800}
.rate{display:flex;justify-content:space-between;align-items:center;margin:0 16px 10px;background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px}
.rate input{width:64px;border:2px solid var(--line);border-radius:10px;padding:3px 6px;text-align:center;background:#fff;font-weight:800}
.lnk{color:var(--acc);font-weight:800}
.rs{margin:0 16px 10px;background:var(--card);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:72px 1fr}
.rs .ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800}
.rs .b{padding:10px 12px}.rs .n{font-weight:800}.rs .m{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.5}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.acts button{flex:1;text-align:center;border-radius:12px;padding:7px;font-size:13px;background:var(--soft);min-width:70px}.acts .y{background:var(--ok);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}.mrow:last-child{border:0}.mrow .r{margin-left:auto;font-size:12px;color:var(--mute);text-align:right}
.link{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:12.5px;margin-top:8px}.link code{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{display:block;width:100%;text-align:center;background:var(--acc);color:#fff;border-radius:16px;padding:13px;font-weight:800;margin-top:12px}
.btn.g{background:#fff;color:var(--ink);border:2px solid #dadce0}.btn.s{background:var(--soft);color:var(--ink)}
.tl{display:block;width:calc(100% - 32px);margin:0 16px 10px;background:var(--card);border-radius:20px;overflow:hidden;text-align:left;text-decoration:none;box-shadow:0 3px 10px #8c491a12}
.tl .cv{height:110px;background:var(--c) center/cover}.tl .b{padding:12px 14px}.tl .n{font-weight:800;font-size:18px}.tl .m{font-size:12.5px;color:var(--mute)}
.hero{padding:40px 24px 10px;text-align:center}.hero h1{font-size:28px;margin:8px 0}.hero p{color:var(--mute);line-height:1.7;font-size:14px}
/* 底部表單 */
.dim{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dim[hidden]{display:none}
.sheet{background:var(--card);border-radius:28px 28px 0 0;padding:14px 18px calc(22px + env(safe-area-inset-bottom));width:min(520px,100%);max-height:92vh;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:#d6c8b2;margin:0 auto 10px}
.sheet{overscroll-behavior:contain;transition:transform .2s ease}.sheet.dragging{transition:none}.grab{touch-action:none}
.dbtn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer}.dbtn span{flex:1;font-weight:700}.dbtn small{font-size:12px;color:var(--mute)}.dbtn i{font-style:normal}
.calp{position:fixed;inset:0;z-index:40;background:#0005;display:flex;align-items:center;justify-content:center;padding:16px}
.cal{background:var(--card);border-radius:24px;padding:16px;width:min(360px,100%);box-shadow:0 12px 40px #0004}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calh b{font-size:17px}.calh button{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:20px;line-height:1}
.calw,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calw span{font-size:12px;color:var(--mute);font-weight:700;padding:4px 0}
.calg button{position:relative;aspect-ratio:1;border-radius:12px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.calg button.trip{background:var(--soft)}.calg button.td{box-shadow:inset 0 0 0 2px var(--line)}
.calg button.on{background:var(--acc);color:#fff;font-weight:800}.calg button i{position:absolute;right:3px;top:1px;font-style:normal;font-size:10px}
.calf{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12.5px;line-height:1.5}.calf em{font-style:normal;color:var(--mute);white-space:nowrap;font-size:11.5px}
.calb{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:10px}.calb .btn{margin-top:0}.calb .btn[disabled]{opacity:.4}
.it .m .rg{display:inline-block;background:var(--soft);border-radius:999px;padding:0 7px;margin-right:5px;font-weight:700;color:var(--ink)}
.lab{font-size:12px;color:var(--mute);font-weight:800;margin:12px 0 6px;display:flex;justify-content:space-between}
.amt{display:flex;align-items:center;gap:10px}.amt input{font-size:30px;font-weight:800;flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:none;padding:2px 0;outline:none}
.cur{display:flex;background:var(--soft);border-radius:999px;padding:3px;flex:none}.cur button{padding:5px 12px;border-radius:999px;font-size:13px}.cur button.on{background:var(--ink);color:#fff}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15px;background:#fff;outline:none}
.inp:focus{border-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:13.5px;font-weight:700;background:#fff}
.chip.on{border-color:var(--acc);background:#fde3cf}.chip .ava{width:24px;height:24px;font-size:11px}
.split{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.split button{text-align:center;border:2px solid var(--line);border-radius:12px;padding:7px 2px;font-size:12.5px;background:#fff}.split button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.shr{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;margin-top:6px;font-size:14px}
.shr input{width:76px;border:2px solid var(--line);border-radius:10px;padding:4px 6px;text-align:right;background:#fff}
.shr .x{color:var(--mute);font-size:12px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(36px + env(safe-area-inset-top));max-width:calc(100% - 32px);text-align:center;background:var(--ink);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.small{font-size:12px;color:var(--mute);line-height:1.6}
/* 嵌在行程網站裡（?embed=）：分頁移到上方當分段切換，懸浮鈕貼近底部 */
html.embed,html.embed body{background:var(--bg)}
html.embed #app{display:flex;flex-direction:column;padding-bottom:84px;min-height:100vh}
html.embed .tabs{order:-1;position:sticky;top:0;left:auto;bottom:auto;transform:none;width:auto;margin:10px 16px 0;padding:4px;border-radius:999px;background:var(--soft);box-shadow:none;z-index:6}
html.embed .tabs a{flex-direction:row;justify-content:center;gap:5px;padding:7px 4px;border-radius:999px;font-size:13px}
html.embed .tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px #0001}
html.embed .tabs i{font-size:14px}
html.embed .top{padding-top:10px}
html.embed .fab{bottom:calc(16px + env(safe-area-inset-bottom))}
html.embed .toast{top:12px}
html.embed .sheet{max-height:94vh}
/* 預算 */
.ppl{display:inline-flex;align-items:center;gap:10px}.ppl button{width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:16px;line-height:1}
.bg{margin:0 16px 12px;background:var(--card);border-radius:20px;padding:6px 14px 10px}
.bh,.br{display:grid;grid-template-columns:minmax(0,1fr) 78px 86px;gap:8px;align-items:start}
.bh{padding:8px 0 6px;border-bottom:1.5px solid var(--ink);align-items:end}.bh b{font-size:15px}.bh i{font-style:normal;font-size:11px;font-weight:800;color:var(--mute);text-align:right}
.br{width:100%;text-align:left;padding:9px 0;border-bottom:1px dashed var(--line)}.br:last-child{border-bottom:0}
.br b{display:block;font-size:14px}.br span{display:block;font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:1px}
.br em{font-style:normal;font-weight:800;font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.br em.unk{justify-self:end;font-weight:700;font-size:11px;color:var(--mute);background:var(--soft);border-radius:999px;padding:1px 8px}
.br span.pn{color:#8c491a;font-weight:800}
.bsum .v{font-size:30px;line-height:1.15}
.bbars,.bnight,.bcard{margin:0 16px 10px;background:var(--card);border-radius:20px;padding:12px 14px}
.bb{display:grid;grid-template-columns:minmax(52px,auto) 1fr 70px;gap:8px;align-items:center;margin:8px 0;font-size:13.5px}
.bb .t{height:14px;border-radius:7px;background:var(--soft);overflow:hidden}.bb .t i{display:block;height:100%;border-radius:7px}
.bb span{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.bbn{font-size:11px;color:var(--mute);text-align:right;margin-top:2px}
.bnight b{font-size:14.5px}.bnight p{margin:2px 0 10px;font-size:11.5px;color:var(--mute)}
.bnight .nc{display:grid;gap:5px;height:132px}
.bnight .nc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.bnight .nc i{display:block;width:100%;border-radius:6px 6px 3px 3px;flex:none}
.bnight .nc em{font-style:normal;font-weight:800;font-size:10.5px;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bnight .nc small{font-size:10px;color:var(--mute);margin-top:4px;height:12px;flex:none}
.bnight .lg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px}.bnight .lg span{display:flex;align-items:center;gap:5px}.bnight .lg i{width:10px;height:10px;border-radius:3px;display:block}
.bcard{padding:2px 14px}.bcard.opt .bch .r{color:var(--mute)}
.bch{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:11px 0;text-align:left}
.bch i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:16px;background:var(--soft)}
.bch b{font-size:15.5px}.bch small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.bch .r{text-align:right;font-weight:800;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}.bch .r small{font-size:11px}.bch .ar{color:var(--mute)}
.bit{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 0 10px 42px;border-top:1px dashed var(--line);text-align:left}
.bit b{font-size:14px;display:block}.bit span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.5}
.bit em{display:inline-block;font-style:normal;font-size:11.5px;font-weight:800;color:#8c491a;background:#f6e2cf;border-radius:999px;padding:2px 9px;margin-top:4px}
.bit .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.bit .r b{font-size:15px}.bit .r small{display:block;font-size:11px;color:var(--mute)}
.bit .unk{font-size:11px;color:var(--mute);background:var(--soft);border-radius:999px;padding:2px 8px;font-weight:700}
/* 預計 vs 實際（2026-10-15） */
.bprog{margin:0 16px 10px;background:var(--card);border-radius:20px;padding:12px 14px}
.bprog .hd{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}.bprog .hd b{font-size:21px;font-variant-numeric:tabular-nums}.bprog .hd span{color:var(--mute);font-weight:700;font-size:14px}
.bprog .t{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0 6px}.bprog .t i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bprog.over .t i{background:var(--acc)}.bprog.over .hd b{color:#b2622d}
.bprog p{margin:0;font-size:12.5px;font-weight:700}.bprog p.s{font-weight:500;font-size:11px;color:var(--mute);margin-top:4px;line-height:1.5}
.bch small .ga{color:var(--ok);font-weight:700}.bch small .ga.over{color:#b2622d}
.bit .r small.act{font-weight:700;margin-top:2px}.bit .r small.act.ok{color:var(--ok)}.bit .r small.act.over{color:#b2622d}.bit .r small.act.no{color:#b8ab9a;font-weight:500}
.bit.bx b{font-size:13px;color:var(--mute)}.bcard.un .bch i{background:#fde3cf}
.split.k2{grid-template-columns:1fr 1fr;margin-top:10px}.split.k2 button{font-size:14px;padding:9px 2px;font-weight:800}
.brec{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;margin:-4px 0 8px 42px;width:calc(100% - 42px);padding:7px 10px;border-radius:12px;background:#eef2e6;text-align:left}
.brec i{font-style:normal;font-size:14px}.brec b{font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brec span{display:block;font-size:10.5px;color:var(--mute)}
.brec em{font-style:normal;font-weight:800;font-size:12.5px;color:#3d6a3a;text-align:right;white-space:nowrap}.brec em small{display:block;font-size:10px;font-weight:500;color:var(--mute)}
.bit.br .bri{font-style:normal;margin-right:6px}.bit.br b{font-size:14px}.bit.br.bx b{color:var(--ink)}
.it .m .bl{display:inline-block;background:#eef2e6;color:#56633f;border-radius:999px;padding:0 7px;margin-right:5px;font-weight:700}
.bt b,.bt em{color:#8c491a}.bt em{font-size:12.5px;white-space:normal}
button.br:active{background:var(--soft)}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}.ck input{width:18px;height:18px}
html.embed .tabs a{font-size:12.5px;gap:3px;padding:7px 2px}
html.embed .tabs{grid-template-columns:repeat(4,1fr)}
/* 電腦版行程網站（?embed=…&wide=1）：沒有分頁列（行程網站自己畫），內容左右兩欄、各自捲動不跟著整頁跑 */
html.wide #app{max-width:none;padding:0 0 24px;display:block;min-height:0}
html.wide .top{display:none}
.cols{display:block}
html.wide .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;padding:0 4px}
html.wide .cols.sw>.cA{grid-column:2;grid-row:1;position:sticky;top:12px}html.wide .cols.sw>.cB{grid-column:1;grid-row:1}
html.wide .cols>div>*{margin-left:0;margin-right:0}html.wide .cols .it{width:100%}
html.wide .cols .day{margin-left:4px;margin-right:4px}html.wide .cols .day:first-child{margin-top:4px}
html.wide .rate{margin:0 4px 14px}
html.wide .sum .ppl{flex-wrap:wrap;overflow:visible}
html.wide .wadd{margin:4px 0 10px}
.whd{display:flex;align-items:baseline;gap:10px;margin:2px 4px 8px}.whd b{font-size:16px}.whd span{font-size:12px;color:var(--mute);flex:1}
html.wide .dim{align-items:center;padding:20px}
html.wide .sheet{border-radius:24px;max-height:min(760px,92vh);padding-bottom:22px}
html.wide .grab{display:none}
html.wide .hero{max-width:520px;margin:0 auto}
html.wide .toast{top:16px}
</style>
</head>
<body>
<div id="app"><div class="hero"><p>載入中…</p></div></div>
<div class="dim" id="dim" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
